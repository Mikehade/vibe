# Local stack: API (FastAPI + MCP), web app (Vite), Postgres.
#   docker compose up          → http://localhost:5173 (TV app), http://localhost:8000/api/v1/docs, /mcp
# For offline demo data without keys: FAKE_SERVICES=true docker compose up
services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${HOME}/.aws:/root/.aws:ro
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibe:vibe_dev_password@postgres:5432/vibe
      FAKE_SERVICES: ${FAKE_SERVICES:-false}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe_dev_password
      POSTGRES_DB: vibe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
